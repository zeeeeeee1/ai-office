<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI社員オフィス</title>
<link rel="stylesheet" href="/ui-kit/ui-kit.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="ce-kit">
<!--AO:BODY-->
<header>
  <div class="ao-head-left">
    <h1>AI社員オフィス</h1>
    <span id="runner-badge"></span>
  </div>
  <div class="ao-head-right">
    <span id="updated-at" class="hint"></span>
  </div>
</header>

<div class="ao-alert-wrap" id="alert"></div>

<nav class="tabs" role="tablist">
  <button class="tab active" type="button" data-tab="0">社員</button>
  <button class="tab" type="button" data-tab="1">承認待ち<span class="ao-count" id="count-approvals" data-zero="1">0</span></button>
  <button class="tab" type="button" data-tab="2">仕事</button>
  <button class="tab" type="button" data-tab="3">定期の仕事</button>
  <button class="tab" type="button" data-tab="4">実行ログ</button>
</nav>

<!-- 社員：名簿｜チャット｜プロフィール -->
<section class="panel active" id="panel-0">
  <div class="ao-office">
    <div>
      <div class="ao-roster-title"><span>メンバー</span><button class="btn" type="button" id="newbot-toggle">＋ 社員を増やす</button></div>
      <div class="ao-roster" id="roster"><div class="loading">読み込み中...</div></div>
      <form class="ao-newbot" id="newbot-form" hidden>
        <input type="text" id="newbot-name" placeholder="名前（例: カナデ）" maxlength="20" required>
        <input type="text" id="newbot-role" placeholder="担当（例: セミナー準備担当）" maxlength="30">
        <input type="text" id="newbot-avatar" placeholder="アイコン（絵文字1つ）" maxlength="4">
        <textarea id="newbot-instructions" rows="3" placeholder="仕事の進め方"></textarea>
        <input type="text" id="newbot-skills" placeholder="使うスキル（カンマ区切り・もらったスキルは skills/ に置く）">
        <div class="ao-actions"><button class="btn btn-primary" type="submit">入社させる</button><button class="btn" type="button" id="newbot-cancel">やめる</button></div>
      </form>
    </div>

    <div class="ao-chat" id="chat">
      <div class="ao-chat-head" id="chat-head"></div>
      <div class="ao-msgs" id="msgs" aria-live="polite"></div>
      <div class="ao-hints" id="hints"></div>
      <form class="ao-composer" id="composer">
        <textarea id="composer-input" rows="1" placeholder="同僚に頼むように書いてください（Enterで送信・Shift+Enterで改行）"></textarea>
        <button class="btn btn-primary" type="submit">頼む</button>
      </form>
    </div>

    <aside class="ao-profile" id="profile"></aside>
  </div>
</section>

<!-- 承認待ち -->
<section class="panel" id="panel-1">
  <h2>本人の判断が要る仕事</h2>
  <div class="ao-approvals" id="approvals"></div>
</section>

<!-- 仕事 -->
<section class="panel" id="panel-2">
  <div class="grid" id="task-cards"></div>
  <div class="table-wrap"><table>
    <thead><tr><th>仕事</th><th>担当</th><th>状態</th><th>受付</th><th></th></tr></thead>
    <tbody id="task-rows"></tbody>
  </table></div>
</section>

<!-- 定期の仕事 -->
<section class="panel" id="panel-3">
  <h2>決まった時刻に自動で始める仕事</h2>
  <form class="ao-sched-form" id="sched-form">
    <select id="sched-bot" aria-label="担当"></select>
    <input type="text" id="sched-spec" placeholder="weekdays 09:10" aria-label="いつ" required>
    <input type="text" id="sched-instruction" placeholder="やること" aria-label="やること" required>
    <button class="btn btn-primary" type="submit">追加</button>
  </form>
  <p class="ao-sched-help">いつ: <code>daily 08:47</code>（毎日）／<code>weekdays 09:10</code>（平日）／<code>weekly mon 10:05</code>（毎週）／<code>every 2h</code>（間隔・15分以上）。前回分が終わっていないときは積み増しません。</p>
  <div class="table-wrap"><table>
    <thead><tr><th>担当</th><th>いつ</th><th>やること</th><th>次回</th><th></th></tr></thead>
    <tbody id="sched-rows"></tbody>
  </table></div>
</section>

<!-- 実行ログ -->
<section class="panel" id="panel-4">
  <h2>実行ログ</h2>
  <ul class="ao-log" id="events"></ul>
</section>

<div class="ao-toast" id="toast" hidden></div>
<!--/AO:BODY-->
<script src="/ui-kit/ui-kit.js"></script>
<script src="/app.js"></script>
</body>
</html>
